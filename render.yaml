services:
  - type: web
    name: kairozen-ai
    runtime: python
    plan: free
    region: singapore
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 120
    envVars:
      - key: GROK_API_KEY
        sync: false
      - key: GROK_MODEL
        value: grok-3
      - key: DATA_DIR
        value: /var/data
